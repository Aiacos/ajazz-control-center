app-id: io.github.Aiacos.AjazzControlCenter
runtime: org.kde.Platform
runtime-version: '6.7'
sdk: org.kde.Sdk
# Rust toolchain for the out-of-process mirajazz Stream Dock sidecar
# (streamdock-host). org.kde.Sdk is based on org.freedesktop.Sdk, so the
# rust-stable extension is available; the streamdock-host module below builds
# offline from the vendored cargo-sources.json.
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: ajazz-control-center

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  # HID device access for /dev/hidraw*. The fine-grained `--device=usb`
  # (SEC-006's preference) needs flatpak >= 1.15, which the org.kde 6.7 runtime
  # does not ship ("Unknown device type usb" at build-finish). `--device=all` is
  # the only device type that exposes hidraw on this runtime. Revisit to
  # `--device=usb` when bumping to a newer (non-EOL) org.kde runtime.
  - --device=all
  # AJAZZ HID devices live under /dev/hidraw*; expose only that namespace.
  - --filesystem=/dev/hidraw0:rw
  - --filesystem=/dev/hidraw1:rw
  - --filesystem=/dev/hidraw2:rw
  - --filesystem=/dev/hidraw3:rw
  - --filesystem=/dev/hidraw4:rw
  - --filesystem=/dev/hidraw5:rw
  - --filesystem=/dev/hidraw6:rw
  - --filesystem=/dev/hidraw7:rw
  - --filesystem=xdg-config/ajazz-control-center:create
  - --filesystem=xdg-data/ajazz-control-center:create

modules:
  - name: hidapi
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - -DHIDAPI_BUILD_HIDTEST=OFF
      - -DHIDAPI_WITH_TESTS=OFF
      # Disable the libusb backend. The Flatpak SDK runtime (org.kde.Platform
      # 6.7) does not ship libusb-1.0, so the default hidapi build fails at
      # `pkg_check_modules(libusb-1.0>=1.0.9)`. Our binary uses only the
      # hidraw backend (kernel-native /dev/hidraw*) on Linux — see
      # `resources/linux/70-ajazz.rules` ("The libusb backend is not used by
      # our binary."). Disabling here aligns the Flatpak build with the
      # runtime behavior already documented.
      - -DHIDAPI_WITH_LIBUSB=OFF
    sources:
      - type: git
        url: https://github.com/libusb/hidapi.git
        tag: hidapi-0.14.0

  - name: pybind11
    buildsystem: cmake-ninja
    sources:
      - type: git
        url: https://github.com/pybind/pybind11.git
        tag: v2.13.6

  # nlohmann/json provided as a module (installs its CMake config into /app) so
  # the app build resolves it with find_package — the flatpak-builder sandbox has
  # no network, so the app's default FetchContent git clone cannot run. Version
  # pinned in lockstep with the FetchContent tag in the root CMakeLists.txt.
  - name: nlohmann-json
    buildsystem: cmake-ninja
    config-opts:
      - -DJSON_BuildTests=OFF
    sources:
      - type: git
        url: https://github.com/nlohmann/json.git
        tag: v3.12.0

  - name: ajazz-control-center
    buildsystem: cmake-ninja
    # Phase 34 (APROF-01) build env: the foreground-window watcher links
    # Qt6::WaylandClient (zwlr-foreign-toplevel binding via qtwaylandscanner)
    # and libX11 (EWMH _NET_ACTIVE_WINDOW reads) on Linux. Both — plus
    # qtwaylandscanner, libwayland and the X11 dev headers — are supplied by the
    # org.kde.Sdk runtime above (the KDE SDK bundles the full qtwayland module
    # and the X11/Wayland client libraries), so no extra build module is needed;
    # the CMake `find_package(Qt6 ... WaylandClient)` + `pkg_check_modules(x11)`
    # resolve against the SDK. The matching runtime sockets are already granted
    # in finish-args (`--socket=wayland`, `--socket=fallback-x11`). If the
    # runtime is ever slimmed below the full KDE SDK, add `org.kde.Sdk`'s
    # qtwayland / libX11 explicitly here.
    # Build in a separate `_flatpak_build/` subdirectory so CMAKE_SOURCE_DIR
    # != CMAKE_BINARY_DIR. Our top-level CMakeLists.txt:21 has a guard
    # `if(${CMAKE_SOURCE_DIR} STREQUAL ${CMAKE_BINARY_DIR})` that fatal-errors
    # on in-source builds, which is the flatpak-builder default with
    # `type: dir`. Without builddir:true, the source tree IS the build tree
    # and the guard fires.
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - -DAJAZZ_BUILD_TESTS=OFF
      - -DAJAZZ_ENABLE_WERROR=OFF
      # Resolve hidapi + nlohmann_json from the modules built above (offline
      # sandbox has no network for the default FetchContent clone).
      - -DAJAZZ_USE_SYSTEM_DEPS=ON
      # The Stream Dock mirajazz sidecar is built offline by the dedicated
      # `streamdock-host` module below (cargo can't fetch crates in the
      # flatpak-builder sandbox), so disable the in-CMake cargo build here.
      - -DAJAZZ_BUILD_SIDECAR=OFF
      # The udev rule installs to an absolute /usr path (read-only in the
      # sandbox) and is a host resource — device access inside Flatpak is via
      # portals + the host's own rule.
      - -DAJAZZ_INSTALL_UDEV_RULES=OFF
    sources:
      - type: dir
        path: ../..
    post-install:
      # CMake's `ninja install` already placed the AppStream metainfo and the
      # SVG + PNG icons under /app/share with the app-id names, and the desktop
      # entry as ajazz-control-center.desktop. (post-install runs in the build
      # dir because of builddir:true, so the previous `install resources/...`
      # relative copies could not find the source files.) Flatpak requires the
      # .desktop to be named after the app-id and to reference the app-id icon,
      # so just rename the installed file and repoint Icon=.
      - mv /app/share/applications/ajazz-control-center.desktop
          /app/share/applications/io.github.Aiacos.AjazzControlCenter.desktop
      - sed -i 's/^Icon=.*/Icon=io.github.Aiacos.AjazzControlCenter/'
          /app/share/applications/io.github.Aiacos.AjazzControlCenter.desktop
      # Point the AppStream <launchable> at the renamed desktop id, otherwise
      # appstreamcli compose cannot link the .desktop to resolve the icon and
      # fails the build with "gui-app-without-icon".
      - sed -i 's#<launchable type="desktop-id">ajazz-control-center.desktop</launchable>#<launchable type="desktop-id">io.github.Aiacos.AjazzControlCenter.desktop</launchable>#'
          /app/share/metainfo/io.github.Aiacos.AjazzControlCenter.appdata.xml
      # Drop the scalable SVG icon: appstreamcli compose prefers it and fails to
      # rasterise it ("file-read-error"). The PNG hicolor sizes (incl. 64 + 128)
      # are enough for AppStream and the desktop icon.
      - rm -f /app/share/icons/hicolor/scalable/apps/io.github.Aiacos.AjazzControlCenter.svg

  # Out-of-process mirajazz Rust sidecar driving the AKP03/AKP05-N4/AKP153 Stream
  # Dock families. Built OFFLINE from the vendored cargo-sources.json (the
  # flatpak-builder sandbox has no network, so cargo cannot fetch crates).
  #
  # Regenerate cargo-sources.json after changing the Rust dependencies:
  #   python3 flatpak-cargo-generator.py streamdock-host/Cargo.lock \
  #     -o packaging/flatpak/cargo-sources.json
  # (flatpak-cargo-generator.py is in flatpak/flatpak-builder-tools/cargo).
  #
  # Installed to /app/bin/streamdock-host so the app resolves it via
  # QCoreApplication::applicationDirPath() (see SidecarStreamDockDevice).
  - name: streamdock-host
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      env:
        CARGO_HOME: /run/build/streamdock-host/cargo
    build-commands:
      - cargo --offline build --release --verbose
      - install -Dm755 target/release/streamdock-host /app/bin/streamdock-host
    sources:
      - type: dir
        path: ../../streamdock-host
      - cargo-sources.json
