<?xml version="1.0" encoding="UTF-8"?>
<!-- glyph: poll rate (report frequency / Hz). Pulse train, last pulse red. Original, theme-tintable. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24"
     fill="none" color="#E8E8EE" stroke="currentColor" stroke-width="2"
     stroke-linecap="round" stroke-linejoin="round">
  <polyline points="2 17 5 17 5 11 7 11 7 17 10 17 10 11 12 11 12 17 15 17"/>
  <polyline points="15 17 15 6 17.5 6 17.5 17 22 17" stroke="#E63946"/>
</svg>
