<?xml version="1.0" encoding="UTF-8"?>
<!-- glyph: lift-off distance (LOD). Mouse body above a surface + red height measure. Original, theme-tintable. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24"
     fill="none" color="#E8E8EE" stroke="currentColor" stroke-width="2"
     stroke-linecap="round" stroke-linejoin="round">
  <!-- surface -->
  <line x1="3" y1="21" x2="21" y2="21"/>
  <!-- mouse body, lifted -->
  <path d="M11 5 a4 4 0 0 1 4 4 v2 a4 4 0 0 1 -8 0 V9 a4 4 0 0 1 4 -4 Z" transform="translate(1 0)"/>
  <!-- lift-distance measure (red) -->
  <g stroke="#E63946">
    <line x1="5" y1="15" x2="5" y2="21"/>
    <polyline points="3.5 16.5 5 15 6.5 16.5"/>
    <polyline points="3.5 19.5 5 21 6.5 19.5"/>
  </g>
</svg>
