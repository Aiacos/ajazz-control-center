<?xml version="1.0" encoding="UTF-8"?>
<!-- glyph: angle snap (straighten motion to an axis). Dashed off-axis ray + red snapped straight ray. Original, theme-tintable. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24"
     fill="none" color="#E8E8EE" stroke="currentColor" stroke-width="2"
     stroke-linecap="round" stroke-linejoin="round">
  <!-- off-axis (raw) motion, dashed -->
  <path d="M4 19 L16 8" stroke-dasharray="2.5 2.5"/>
  <!-- angle arc at the vertex -->
  <path d="M9 19 A5 5 0 0 0 7.4 15.4"/>
  <!-- snapped straight result (red, with arrowhead) -->
  <line x1="4" y1="19" x2="20" y2="19" stroke="#E63946"/>
  <polyline points="17.5 16.8 20 19 17.5 21.2" stroke="#E63946"/>
</svg>
