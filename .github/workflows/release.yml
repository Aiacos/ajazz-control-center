name: Release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish (e.g. v0.1.0)
        required: true

# Serialise per-tag so a `push: tags` event and a manual
# `workflow_dispatch` re-trigger for the same tag don't race each other
# trying to publish the same GitHub Release. `cancel-in-progress: false`
# because cancelling halfway through a 60-min platform build (and the
# subsequent code-sign + notarize) would waste runner minutes and leave
# the release in a half-published state.
concurrency:
  group: release-${{ github.ref_name || github.event.inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: read           # least privilege; the publish job overrides to write

jobs:
  # ---------------------------------------------------------------------------
  # Linux — .deb + .rpm via CPack
  # ---------------------------------------------------------------------------
  linux-packages:
    name: Linux · deb + rpm
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          # Packaged artifacts must carry the OpenDeck SPA (webui submodule)
          # and the bundled sysmon plugin (btop submodule) — without this the
          # webui/bundle CMake blocks silently skip and ship a bare app.
          submodules: recursive
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config \
              libudev-dev libusb-1.0-0-dev libhidapi-dev \
              libgl1-mesa-dev libxkbcommon-dev libxcb1-dev \
              libxcb-cursor-dev libxkbcommon-x11-dev \
              libwayland-dev wayland-protocols libx11-dev \
              g++-14 \
              python3-dev rpm file
      - uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730  # v4.3.1
        with:
          version: 6.8.3
          cache: true
          # qtwebengine (+its qtwebchannel/qtpositioning deps) is REQUIRED for
          # the OpenDeck SPA embed: without it the webui CMake block silently
          # degrades to the native QML fallback and the package ships without
          # the editor (run 28621960235's 'SPA not bundled' gate failure).
          modules: qtwebsockets qtwebengine qtwebchannel qtpositioning
      # Rust toolchain for the streamdock-host mirajazz sidecar (bundled into the
      # deb/rpm by cmake/StreamdockSidecar.cmake).
      - name: Set up Rust (stable)
        run: rustup toolchain install stable --profile minimal --no-self-update && rustup default stable
      - name: Configure
        # Packaging legs build with -Werror OFF: a compiler false positive
        # (e.g. GCC 13 -Wnull-dereference at -O2, Release run 28620095630) must
        # not block shipping artifacts. Warnings-as-errors is enforced by the
        # per-PR CI matrix instead; the Flatpak manifest already does the same
        # (-DAJAZZ_ENABLE_WERROR=OFF in config-opts).
        run: cmake --preset linux-release -DAJAZZ_ENABLE_WERROR=OFF
      - name: Build
        run: cmake --build --preset linux-release
      - name: Package (deb + rpm)
        working-directory: build/linux-release
        run: |
          cpack -G DEB
          cpack -G RPM
      - name: Verify SPA + bundled sysmon shipped
        working-directory: build/linux-release
        # The webui/bundle CMake blocks degrade to a SKIP when their inputs are
        # missing (submodule / node / cargo) — fail LOUD here instead of
        # shipping a package without the OpenDeck editor or the first-party
        # plugin (mirrors the Windows "Verify Qt runtime bundled" gate).
        run: |
          set -euo pipefail
          test -f bundled-plugins/com.ajazz.sysmon2.sdPlugin/manifest.json \
            || { echo "::error::sysmon bundle missing from build tree"; exit 1; }
          # Don't pipe into `grep -q` under pipefail: grep's early exit on the
          # first match SIGPIPEs the producer (dpkg-deb's tar child returned 2,
          # run 28621191730) and the gate false-negatives on a GOOD package.
          # List to a file, then grep the file.
          dpkg-deb -c ./*.deb > /tmp/deb-contents.txt
          grep -q "bundled-plugins/com.ajazz.sysmon2.sdPlugin/manifest.json" /tmp/deb-contents.txt \
            || { echo "::error::sysmon bundle missing from the .deb payload"; exit 1; }
          strings src/app/ajazz-control-center > /tmp/app-strings.txt
          grep -q "opendeck/index.html" /tmp/app-strings.txt \
            || { echo "::error::OpenDeck SPA not bundled into the binary"; exit 1; }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: linux-packages
          path: |
            build/linux-release/*.deb
            build/linux-release/*.rpm

  # ---------------------------------------------------------------------------
  # Linux — Flatpak bundle
  # ---------------------------------------------------------------------------
  linux-flatpak:
    name: Linux · Flatpak
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    container:
      # kde-6.8: must match the manifest's runtime-version (Qt >= 6.8 needed by
      # the wayland PRIVATE_CODE codegen in src/app/CMakeLists.txt).
      # ghcr.io/flathub-infra is the maintained registry — the Docker Hub
      # bilelmoussaoui/* mirror stopped publishing at kde-6.7.
      image: ghcr.io/flathub-infra/flatpak-github-actions:kde-6.8
      options: --privileged
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          # Packaged artifacts must carry the OpenDeck SPA (webui submodule)
          # and the bundled sysmon plugin (btop submodule) — without this the
          # webui/bundle CMake blocks silently skip and ship a bare app.
          submodules: recursive
      - uses: flatpak/flatpak-github-actions/flatpak-builder@401fe28a8384095fc1531b9d320b292f0ee45adb  # v6.7
        with:
          bundle: ajazz-control-center.flatpak
          manifest-path: packaging/flatpak/io.github.Aiacos.AjazzControlCenter.yml
          cache-key: flatpak-builder-${{ github.sha }}

  # ---------------------------------------------------------------------------
  # Windows — MSI installer via CPack/WIX
  # ---------------------------------------------------------------------------
  windows-msi:
    name: Windows · MSI
    runs-on: windows-2022
    timeout-minutes: 60
    # SEC-020: when secrets.WIN_CERT_BASE64 + WIN_CERT_PASSWORD are present
    # (Authenticode certificate, base64-encoded .pfx), the build sign the
    # app .exe before MSI packaging, the .msi after packaging, and a
    # SmartScreen-friendly EV chain ships in the release. Without those
    # secrets the steps no-op and the unsigned binary is published, so a
    # fork without certs still produces an installable artifact.
    env:
      WIN_CERT_BASE64: ${{ secrets.WIN_CERT_BASE64 }}
      WIN_CERT_PASSWORD: ${{ secrets.WIN_CERT_PASSWORD }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          # Packaged artifacts must carry the OpenDeck SPA (webui submodule)
          # and the bundled sysmon plugin (btop submodule) — without this the
          # webui/bundle CMake blocks silently skip and ship a bare app.
          submodules: recursive
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756  # v1.13.0
      - uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730  # v4.3.1
        with:
          version: 6.8.3
          cache: true
          # qtwebengine (+its qtwebchannel/qtpositioning deps) is REQUIRED for
          # the OpenDeck SPA embed: without it the webui CMake block silently
          # degrades to the native QML fallback and the package ships without
          # the editor (run 28621960235's 'SPA not bundled' gate failure).
          modules: qtwebsockets qtwebengine qtwebchannel qtpositioning
      # Rust toolchain for the streamdock-host mirajazz sidecar (bundled into the
      # MSI/ZIP by cmake/StreamdockSidecar.cmake). rustup ships on the runner.
      - name: Set up Rust (stable)
        run: rustup toolchain install stable --profile minimal --no-self-update && rustup default stable
      - name: Configure
        # Same -Werror rationale as the linux packaging leg above.
        run: cmake --preset windows-release -DAJAZZ_ENABLE_WERROR=OFF
      - name: Build
        run: cmake --build --preset windows-release

      - name: Import Authenticode certificate
        if: env.WIN_CERT_BASE64 != ''
        shell: pwsh
        run: |
          $certBytes = [Convert]::FromBase64String($env:WIN_CERT_BASE64)
          $certPath  = Join-Path $env:RUNNER_TEMP "cert.pfx"
          [IO.File]::WriteAllBytes($certPath, $certBytes)
          "WIN_CERT_PATH=$certPath" >> $env:GITHUB_ENV

      - name: Code-sign application binary
        if: env.WIN_CERT_BASE64 != ''
        shell: pwsh
        # Sign the .exe before MSI packaging so the installed binary
        # carries a valid signature (signing only the MSI leaves the
        # extracted .exe unsigned and triggers SmartScreen on first run).
        run: |
          $exe = Get-ChildItem build/windows-release -Recurse -Include *.exe |
                 Where-Object { $_.Name -like "ajazz*" } |
                 Select-Object -First 1
          if (-not $exe) { throw "No ajazz*.exe found to sign" }
          & signtool sign `
              /f "$env:WIN_CERT_PATH" `
              /p "$env:WIN_CERT_PASSWORD" `
              /fd SHA256 /td SHA256 `
              /tr http://timestamp.digicert.com `
              /d "AJAZZ Control Center" `
              "$($exe.FullName)"
          & signtool verify /pa /v "$($exe.FullName)"

      - name: Package (MSI + ZIP)
        working-directory: build/windows-release
        shell: pwsh
        run: |
          # WIX failure is fatal: the job must not silently ship only the ZIP.
          # On failure, dump wix.log so the cause is visible in the run log.
          cpack -G WIX
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::group::wix.log (cpack -G WIX failed, exit $LASTEXITCODE)"
            Get-ChildItem -Recurse -Path _CPack_Packages -Filter wix.log -ErrorAction SilentlyContinue |
              ForEach-Object { Write-Host "==== $($_.FullName) ===="; Get-Content -Raw $_.FullName }
            Write-Host "::endgroup::"
            throw "WIX MSI packaging failed"
          }
          cpack -G ZIP
          if ($LASTEXITCODE -ne 0) { throw "ZIP packaging failed" }

      - name: Verify Qt runtime bundled in package
        working-directory: build/windows-release
        shell: pwsh
        # Guard against the v0.1.0 regression: cpack -G WIX/ZIP succeeds even when the install
        # tree is missing every Qt DLL, shipping an MSI that fails at launch with
        # "Qt6Widgets.dll was not found". Unzip the built ZIP (same install tree the MSI
        # harvests) and assert the Qt runtime is actually present: the core widget DLL plus the
        # windows platform plugin (without qwindows.dll the app aborts with "no Qt platform
        # plugin could be initialized"). Runs before code-signing so a broken package fails the
        # release job loudly instead of publishing an unrunnable installer.
        run: |
          $zip = Get-ChildItem *.zip | Select-Object -First 1
          if (-not $zip) { throw "No ZIP produced — cannot verify Qt runtime" }
          $dest = Join-Path $env:RUNNER_TEMP "acc-pkg-verify"
          if (Test-Path $dest) { Remove-Item -Recurse -Force $dest }
          Expand-Archive -Path $zip.FullName -DestinationPath $dest
          $required = @("Qt6Widgets.dll", "qwindows.dll")
          $missing = @()
          foreach ($f in $required) {
            if (-not (Get-ChildItem -Recurse -Path $dest -Filter $f)) { $missing += $f }
          }
          if ($missing.Count -gt 0) {
            Write-Host "::group::package contents"
            Get-ChildItem -Recurse -Path $dest | ForEach-Object { Write-Host $_.FullName }
            Write-Host "::endgroup::"
            throw "Qt runtime missing from Windows package: $($missing -join ', '). windeployqt did not populate the install tree."
          }
          Write-Host "OK: Qt runtime bundled ($($required -join ', '))"

      - name: Code-sign MSI
        if: env.WIN_CERT_BASE64 != ''
        shell: pwsh
        run: |
          $msi = Get-ChildItem build/windows-release/*.msi | Select-Object -First 1
          if (-not $msi) { throw "No MSI found to sign" }
          & signtool sign `
              /f "$env:WIN_CERT_PATH" `
              /p "$env:WIN_CERT_PASSWORD" `
              /fd SHA256 /td SHA256 `
              /tr http://timestamp.digicert.com `
              /d "AJAZZ Control Center" `
              "$($msi.FullName)"
          & signtool verify /pa /v "$($msi.FullName)"

      - name: Cleanup certificate
        if: always() && env.WIN_CERT_BASE64 != ''
        shell: pwsh
        # Delete the .pfx even on failure so the runner image (although
        # ephemeral) never has the key material on disk after the job.
        run: Remove-Item -ErrorAction SilentlyContinue "$env:WIN_CERT_PATH"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: windows-packages
          path: |
            build/windows-release/*.msi
            build/windows-release/*.zip

  # ---------------------------------------------------------------------------
  # macOS — universal DMG (x86_64 + arm64)
  # ---------------------------------------------------------------------------
  macos-dmg:
    name: macOS · Universal DMG
    runs-on: macos-14
    timeout-minutes: 60
    # SEC-020: when secrets.APPLE_CERT_BASE64 + APPLE_CERT_PASSWORD are
    # set, the .app gets codesigned with a Developer ID Application
    # certificate, the DMG is built around the signed app, then
    # notarized + stapled via notarytool. APPLE_ID +
    # APPLE_TEAM_ID + APPLE_APP_SPECIFIC_PASSWORD drive the
    # notary submission. Without those secrets the steps no-op.
    env:
      APPLE_CERT_BASE64: ${{ secrets.APPLE_CERT_BASE64 }}
      APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          # Packaged artifacts must carry the OpenDeck SPA (webui submodule)
          # and the bundled sysmon plugin (btop submodule) — without this the
          # webui/bundle CMake blocks silently skip and ship a bare app.
          submodules: recursive
      - name: Install deps
        run: brew install ninja create-dmg
      - uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730  # v4.3.1
        with:
          version: 6.8.3
          cache: true
          # qtwebengine (+its qtwebchannel/qtpositioning deps) is REQUIRED for
          # the OpenDeck SPA embed: without it the webui CMake block silently
          # degrades to the native QML fallback and the package ships without
          # the editor (run 28621960235's 'SPA not bundled' gate failure).
          modules: qtwebsockets qtwebengine qtwebchannel qtpositioning

      - name: Import Developer ID certificate
        if: env.APPLE_CERT_BASE64 != ''
        # Create a fresh keychain so the cert never leaks into the
        # default macos-runner login.keychain. The keychain is
        # destroyed on cleanup.
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PWD=$(uuidgen)
          security create-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"
          echo "$APPLE_CERT_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" \
              -k "$KEYCHAIN_PATH" -P "$APPLE_CERT_PASSWORD" \
              -A -t cert -f pkcs12
          security set-key-partition-list -S apple-tool:,apple: \
              -k "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"
          # Need word-splitting on the inner $(): user keychain list is
          # multiple whitespace-separated paths and we want each one
          # passed as its own argument to -s. shellcheck flags this as
          # a quoting issue; the unquoted form is correct here.
          # shellcheck disable=SC2046
          security list-keychain -d user -s "$KEYCHAIN_PATH" \
              $(security list-keychain -d user | tr -d ' "')
          rm -f "$RUNNER_TEMP/cert.p12"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      # Rust toolchain for the streamdock-host mirajazz sidecar. Both Apple
      # targets are installed so cmake/StreamdockSidecar.cmake can lipo a
      # universal (arm64 + x86_64) sidecar matching the universal app bundle.
      - name: Set up Rust (stable, universal targets)
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Configure (universal)
        run: |
          cmake -S . -B build/macos-release -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DAJAZZ_ENABLE_WERROR=OFF
      - name: Build
        run: cmake --build build/macos-release

      - name: Install to staging (deploys Qt runtime)
        # cpack's internal install would run macdeployqt AFTER signing, leaving every nested
        # framework unsigned and failing notarization. So install explicitly to a staging prefix
        # first — this runs the deploy script (qt_generate_deploy_qml_app_script -> macdeployqt,
        # src/app/CMakeLists.txt) — and sign the STAGED bundle, then package from staging.
        run: |
          set -euo pipefail
          cmake --install build/macos-release --prefix "$RUNNER_TEMP/acc-stage"

      - name: Code-sign .app bundle
        if: env.APPLE_CERT_BASE64 != ''
        # `--options runtime` is required by Apple notarization (hardened
        # runtime). `--deep` recurses into the bundle so all nested
        # frameworks/dylibs are signed with the same identity. The bundle
        # name is the CMake target name: ajazz-control-center.app.
        run: |
          set -euo pipefail
          APP=$(find "$RUNNER_TEMP/acc-stage" -name "ajazz-control-center.app" -maxdepth 3 | head -1)
          if [ -z "$APP" ]; then echo "::error::No .app bundle found in staging" >&2; exit 1; fi
          codesign --force --deep --timestamp --options runtime \
              --sign "$APPLE_SIGNING_IDENTITY" "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"

      - name: Package (DMG + TGZ)
        working-directory: build/macos-release
        # Packaged from the signed staging tree rather than cpack, because cpack re-installs from
        # the build tree (dropping the staged signature). create-dmg + tar produce the same
        # artifacts cpack DragNDrop/TGZ did (same filenames the publish job expects), with the
        # signed bundle intact. hdiutil intermittently fails with "Resource busy" on hosted
        # macOS runners (XProtect scans the fresh mount) — retry up to 3 times, same as the
        # old cpack loop.
        run: |
          set -euo pipefail
          APP=$(find "$RUNNER_TEMP/acc-stage" -name "ajazz-control-center.app" -maxdepth 3 | head -1)
          if [ -z "$APP" ]; then echo "::error::No .app bundle found in staging" >&2; exit 1; fi
          APP_BASENAME=$(basename "$APP")
          VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Contents/Info.plist")
          DMG_NAME="ajazz-control-center-${VERSION}-Darwin.dmg"
          TGZ_NAME="ajazz-control-center-${VERSION}-Darwin.tar.gz"
          for attempt in 1 2 3; do
            if create-dmg \
                --volname "AJAZZ Control Center" \
                --window-pos 200 120 \
                --window-size 800 400 \
                --icon-size 100 \
                --icon "$APP_BASENAME" 200 190 \
                --app-drop-link 600 185 \
                --no-internet-enable \
                "$DMG_NAME" "$APP" >/dev/null 2>&1; then
              break
            fi
            if [ "$attempt" = 3 ]; then
              echo "::error::create-dmg failed after 3 attempts"
              exit 1
            fi
            echo "::warning::create-dmg attempt ${attempt} failed (hdiutil flake?), retrying in 10s"
            sleep 10
          done
          tar -C "$RUNNER_TEMP/acc-stage" -czf "$TGZ_NAME" "$APP_BASENAME"

      - name: Verify Qt runtime bundled in package
        working-directory: build/macos-release
        # Same gate as nightly.yml's macOS leg: without this, a bundle with no Frameworks/ dir
        # ships silently and the app aborts at launch with "dyld: Library not loaded:
        # @rpath/QtWebSockets.framework/...". Runs before notarization so a broken artifact
        # never burns an Apple notary submission.
        run: |
          set -euo pipefail
          tgz=$(ls *.tar.gz | head -1)
          if [ -z "$tgz" ]; then echo "::error::No TGZ produced — cannot verify Qt runtime" >&2; exit 1; fi
          dest="$RUNNER_TEMP/acc-pkg-verify"
          rm -rf "$dest" && mkdir -p "$dest"
          tar -xzf "$tgz" -C "$dest"
          app=$(find "$dest" -name "*.app" -maxdepth 3 | head -1)
          if [ -z "$app" ]; then echo "::error::No .app in $tgz" >&2; exit 1; fi
          required=(
            "$app/Contents/Frameworks/QtWidgets.framework/Versions/A/QtWidgets"
            "$app/Contents/Frameworks/QtWebEngineCore.framework/Versions/A/QtWebEngineCore"
            "$app/Contents/PlugIns/platforms/libqcocoa.dylib"
            "$app/Contents/Resources/qml/AjazzControlCenter/qmldir"
            "$app/Contents/Resources/qml/QtQuick/Controls/qmldir"
          )
          missing=0
          for f in "${required[@]}"; do
            if [ ! -f "$f" ]; then
              echo "::error::missing: ${f#$app/Contents/}"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::group::package contents"
            find "$app/Contents" -maxdepth 3 | sort
            echo "::endgroup::"
            echo "::error::Qt runtime missing from macOS package. macdeployqt did not populate the bundle." >&2
            exit 1
          fi
          echo "OK: Qt runtime + QML module bundled (QtWidgets.framework, QtWebEngineCore.framework, qcocoa platform plugin, AjazzControlCenter + QtQuick.Controls qml dirs)"

      - name: Notarize + staple DMG
        if: env.APPLE_CERT_BASE64 != ''
        # notarytool ships with Xcode 13+ (preinstalled on macos-14).
        # `--wait` blocks until notarization completes (typically
        # 1-5 min). On success, `xcrun stapler staple` embeds the
        # ticket so the DMG installs offline without re-checking with
        # Apple's notary server.
        run: |
          set -euo pipefail
          DMG=$(find build/macos-release -maxdepth 1 -name '*.dmg' | head -1)
          if [ -z "$DMG" ]; then echo "::error::No DMG to notarize" >&2; exit 1; fi
          codesign --force --timestamp --options runtime \
              --sign "$APPLE_SIGNING_IDENTITY" "$DMG"
          xcrun notarytool submit "$DMG" \
              --apple-id "$APPLE_ID" \
              --team-id "$APPLE_TEAM_ID" \
              --password "$APPLE_APP_SPECIFIC_PASSWORD" \
              --wait
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"

      - name: Cleanup keychain
        if: always() && env.APPLE_CERT_BASE64 != ''
        run: |
          if [ -n "${KEYCHAIN_PATH:-}" ] && [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: macos-packages
          path: |
            build/macos-release/*.dmg
            build/macos-release/*.tar.gz

  # ---------------------------------------------------------------------------
  # Publish GitHub release
  # ---------------------------------------------------------------------------
  publish:
    name: Publish GitHub release
    needs: [ linux-packages, linux-flatpak, windows-msi, macos-dmg ]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write           # for softprops/action-gh-release
      id-token: write           # for Sigstore OIDC
      attestations: write       # for actions/attest-build-provenance
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          # Packaged artifacts must carry the OpenDeck SPA (webui submodule)
          # and the bundled sysmon plugin (btop submodule) — without this the
          # webui/bundle CMake blocks silently skip and ship a bare app.
          submodules: recursive
        # Needed so the release-notes template (.github/RELEASE_NOTES_TEMPLATE.md)
        # is on disk for body_path below.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with: { path: dist }
      - name: List artifacts
        run: find dist -type f
      - name: Generate SHA256 checksums
        # Provides reproducible integrity verification for users.
        # Mitigates SEC-014 (release artifacts published unsigned).
        working-directory: dist
        run: |
          set -euo pipefail
          mapfile -t files < <(find . -type f \( \
              -name '*.deb' -o -name '*.rpm' -o -name '*.msi' -o \
              -name '*.zip' -o -name '*.dmg' -o -name '*.tar.gz' -o \
              -name '*.flatpak' \) | sort)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No artifacts found to checksum"; exit 1
          fi
          sha256sum "${files[@]}" > SHA256SUMS
          echo "=== SHA256SUMS ==="
          cat SHA256SUMS
      - name: Attest release artifacts
        # SLSA Level 3 build-provenance via Sigstore + GitHub OIDC.
        # Mitigates SEC-014 (release artifacts published unsigned).
        # Verify with: gh attestation verify <file> --owner Aiacos
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373  # v4.1.1
        with:
          subject-path: |
            dist/linux-packages/*
            dist/windows-packages/*
            dist/macos-packages/*
            dist/ajazz-control-center-x86_64.flatpak/*.flatpak
      - name: Create release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b  # v3.0.1
        with:
          # Prefer the explicit workflow_dispatch input; on a tag push there is
          # no input so fall back to the pushed ref. (The old order put
          # github.ref_name first, so a manual dispatch — which runs on `main` —
          # published to a bogus `main` tag instead of the requested version.)
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          # Curated downloads + install guide rendered at the top of the
          # release; generate_release_notes: true appends the auto-generated
          # "What's Changed" / contributor list below it.
          body_path: .github/RELEASE_NOTES_TEMPLATE.md
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/linux-packages/*
            dist/windows-packages/*
            dist/macos-packages/*
            dist/ajazz-control-center-x86_64.flatpak/*.flatpak
            dist/SHA256SUMS
