# SPDX-License-Identifier: GPL-3.0-or-later
# CodeQL static analysis for C++ and Python.
name: CodeQL

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Weekly Monday at 06:17 UTC.
    - cron: '17 6 * * 1'

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    # ubuntu-24.04 ships gcc-13/libstdc++-13 which has full <format>
    # support; the project source uses std::format unconditionally via
    # ajazz/core/logger.hpp so older runners cannot compile it.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: cpp
            build-mode: manual
          - language: python
            build-mode: none
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: +security-and-quality
          # Result filter only (vendored _deps + moc autogen under build/);
          # see the config for rationale.
          config-file: ./.github/codeql/codeql-config.yml

      - name: Install Linux build dependencies
        if: matrix.language == 'cpp'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ninja-build cmake \
            libusb-1.0-0-dev libhidapi-dev libudev-dev \
            libgl1-mesa-dev libxkbcommon-dev \
            libwayland-dev wayland-protocols

      - name: Install Qt
        if: matrix.language == 'cpp'
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: '6.8.3'
          # qtwebsockets matches the CI/Nightly/Lint installs so the
          # SdPluginServer (Elgato plugin host) gets analysed by CodeQL
          # too — otherwise the entire `src/app/src/sd_plugin_server.cpp`
          # translation unit is compiled-out (AJAZZ_HAVE_WEBSOCKETS=OFF)
          # and a whole subsystem ships unanalysed.
          modules: 'qtshadertools qtwebsockets'
          # Cache the Qt install across CodeQL runs (~1.3 GB, ~2 min to
          # download). The cache is shared with the other Qt installs in
          # this repo via the `install-qt-action` default cache prefix.
          cache: true

      - name: Build (C++)
        if: matrix.language == 'cpp'
        # AJAZZ_BUILD_SIDECAR=OFF: CodeQL analyses the C++ tree; the Rust sidecar
        # is out of scope, so skip its cargo build during the manual build.
        run: |
          cmake --preset dev -DAJAZZ_BUILD_PYTHON_HOST=OFF -DAJAZZ_BUILD_TESTS=OFF \
            -DAJAZZ_BUILD_SIDECAR=OFF
          cmake --build --preset dev -j 2

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: '/language:${{ matrix.language }}'
