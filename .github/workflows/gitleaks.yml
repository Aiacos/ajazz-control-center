# SPDX-License-Identifier: GPL-3.0-or-later
# Scans the repository for committed secrets using gitleaks.
name: Secret scan

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '23 4 * * 1'

concurrency:
  group: gitleaks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          # gitleaks-action v2 hard-requires GITHUB_TOKEN to scan pull
          # requests; without it the action exits with
          # "🛑 GITHUB_TOKEN is now required to scan pull requests".
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITLEAKS_LICENSE is required for organisation accounts; for personal
          # accounts the action runs without it. Set if you need org-level
          # reporting.
          GITLEAKS_NOTIFY_USER_LIST: '@Aiacos'
