name: CI

# Build + test on Linux / Windows / macOS. Linting lives in its own
# workflow (`lint.yml`) so formatting churn does not block builds.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Build & test matrix — Linux, Windows, macOS.
  # ---------------------------------------------------------------------------
  build:
    name: Build ${{ matrix.os }} · ${{ matrix.build_type }}
    # Hard cap so a stuck Qt install or hidapi clone can't burn the action
    # budget. Build matrix empirically finishes in <15 min; 45 min covers
    # transient slow runners and Qt cache misses.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            preset: linux-release
            build_type: Release
          - os: windows-2022
            preset: windows-release
            build_type: Release
          - os: macos-14
            preset: macos-release
            build_type: Release

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          # Release/nightly packaging checks out submodules (OpenDeck SPA +
          # btop for the sysmon bundle) — the PR matrix must exercise the SAME
          # build paths or packaging-only breakage ships silently to the
          # release workflow (runs 28618367640/28619135595: sysmon bundle
          # compile + wayland deps failed only at release time).
          submodules: recursive

      # ---- Pitfall 11 invariant: `hid_open` must stay inside hid_transport.cpp
      # Runs only on Linux (the source tree is identical across runners — one
      # check is enough) and BEFORE any Qt install / build step so a violation
      # fails fast without burning ~10min of compile time.
      - name: Enforce hid_open invariant (Pitfall 11)
        if: runner.os == 'Linux'
        run: |
          # Pitfall 11: hid_open + hid_set_nonblocking must stay paired in
          # src/core/src/hid_transport.cpp. Any new hid_open() call elsewhere
          # in src/ skips the non-blocking flag and breaks I/O-thread shutdown.
          if grep -rn 'hid_open(' src/ | grep -v hid_transport.cpp | grep -v 'hid_open_path('; then
            echo "::error::hid_open() found outside src/core/src/hid_transport.cpp — Pitfall 11 invariant violated."
            exit 1
          fi
          echo "hid_open invariant OK — only hid_transport.cpp opens HID handles."

      # ---- Phase 30 HOST-03 invariants: loopback-only bind + SIGPIPE handler
      # Runs only on Linux (source tree is identical across runners — one check
      # is enough) and BEFORE any Qt install / build step for fast failure.
      - name: Enforce loopback-only + SIGPIPE invariants (Phase 30)
        if: runner.os == 'Linux'
        run: |
          # QHostAddress::Any must appear only in comments, never in live code.
          # The existing comment hits in sd_plugin_server.{cpp,hpp} document the
          # security delta from the vendor bind — they are excluded by the filter.
          if grep -rn 'QHostAddress::Any' src/ | grep -vP ':[0-9]+:\s*(//|[*])'; then
            echo "::error::QHostAddress::Any found in non-comment source — loopback-only violated."
            exit 1
          fi
          # SIGPIPE handler must be present in main.cpp so a broken plugin IPC
          # pipe cannot kill the host process.
          if ! grep -n 'SIGPIPE' src/app/src/main.cpp | grep -q 'SIG_IGN'; then
            echo "::error::SIGPIPE SIG_IGN handler missing from main.cpp."
            exit 1
          fi
          echo "Loopback-only + SIGPIPE invariants OK."

      # ---- VERIF-02 milestone modularity gates (v2.0)
      # Runs only on Linux (source tree is identical across runners) and BEFORE
      # any Qt install / build step for fast failure. Delegates to the scripted,
      # comment-aware gates so the local run and CI agree byte-for-byte. This
      # EXTENDS — does not replace — the Phase-30 QHostAddress::Any/SIGPIPE gate
      # above (which fails even faster on the security-critical bind). The
      # script re-checks QHostAddress::Any plus the mirajazz/nlohmann/makeAkp
      # modularity boundaries.
      - name: Enforce milestone modularity gates (VERIF-02)
        if: runner.os == 'Linux'
        run: bash scripts/verif-milestone-gates.sh

      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
              build-essential cmake ninja-build pkg-config \
              libudev-dev libusb-1.0-0-dev libhidapi-dev \
              libgl1-mesa-dev libxkbcommon-dev libxcb1-dev \
              libxcb-cursor-dev libxkbcommon-x11-dev \
              libwayland-dev wayland-protocols libx11-dev \
              g++-14 \
              python3-dev python3-pip

      - name: Install macOS deps
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install ninja hidapi pkg-config

      - name: Install Windows deps
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756  # v1.13.0
      - name: Install Qt 6
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730  # v4.3.1
        with:
          version: 6.8.3
          cache: true
          # qtwebsockets is required by src/app/src/sd_plugin_server.cpp
          # (Stream Deck Elgato v6 plugin server, P3.16). The CMake build
          # tolerates its absence (find_package(... QUIET) sets
          # AJAZZ_HAVE_WEBSOCKETS=OFF), but for CI we want the .cpp
          # actually compiled so the integration is exercised.
          # qtwebengine (+qtwebchannel/qtpositioning deps): required for the
          # OpenDeck SPA embed — without it the webui block silently builds
          # the native QML fallback and the WebEngine TUs are never compiled
          # in the PR matrix (packaging parity; see release.yml).
          # qtwayland (Qt6::WaylandClient + qtwaylandscanner, Phase 34 APROF-01
          # watcher) is NO LONGER a separate module: the 2026-06 restructure of
          # the Qt online repo folded the qtwayland archive into the BASE
          # desktop install (only qtwaylandcompositor remains an addon), and
          # requesting the old module name now hard-fails aqtinstall on every
          # platform ("packages ['qtwayland'] were not found").
          modules: qtshadertools qtwebsockets qtwebengine qtwebchannel qtpositioning

      # ---- Python ---------------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.11"
          # Cache the pip wheel store keyed on pyproject.toml so the
          # `pip install -e .[dev]` step below restores `cryptography`,
          # `pytest`, `mypy` etc from cache on consecutive runs instead
          # of re-resolving + re-downloading every time. Saves ~30s per
          # matrix leg.
          cache: pip
          cache-dependency-path: pyproject.toml

      # Install the Python package + dev deps BEFORE the C++ test step. The
      # `test_manifest_signer.cpp` Catch2 cases exec `python3 scripts/sign-plugin-manifest.py`
      # via the C++ verifier, which imports `cryptography`. With this step ordered after
      # `Test`, the C++ tests would silently fail on a fresh runner image whose system
      # Python lacks `cryptography` (SEC-003 #51 follow-up).
      - name: Install Python package
        run: pip install -e .[dev]

      # The Ed25519 verify gate (manifest_signer.cpp::resolveTrustedExecutable)
      # runs the verifier with the SYSTEM python3 from a vetted dir
      # (/usr/bin, /usr/local/bin, /bin) — NEVER via $PATH — so a PATH-hijack
      # cannot forge a "valid signature" verdict (CWE-426). `setup-python`
      # installs `cryptography` into its OWN interpreter, which the vetted
      # /usr/bin/python3 cannot import; on macOS that interpreter therefore
      # exits 1 on every `verify` (ModuleNotFoundError), which the C++ side
      # maps to SignatureState::Invalid → every signed plugin verifies as
      # Refused and the self-signed gate tests fail. The Linux runner's
      # /usr/bin/python3 already carries cryptography, so this is macOS-only.
      # Install cryptography INTO the vetted interpreter the verifier actually
      # uses; the final import is a hard gate so a silent install miss fails
      # loudly here instead of as a confusing verdict mismatch later.
      - name: Install cryptography into the vetted python3 (macOS verifier)
        if: runner.os == 'macOS'
        run: |
          sudo /usr/bin/python3 -m ensurepip 2>/dev/null || true
          sudo /usr/bin/python3 -m pip install "cryptography>=42.0" \
            || sudo /usr/bin/python3 -m pip install --break-system-packages "cryptography>=42.0" \
            || /usr/bin/python3 -m pip install --user "cryptography>=42.0" \
            || /usr/bin/python3 -m pip install --user --break-system-packages "cryptography>=42.0"
          /usr/bin/python3 -c "import sys, cryptography; print('cryptography', cryptography.__version__, 'importable by', sys.executable)"

      # ---- Rust toolchain (mirajazz Stream Dock sidecar) ------------------
      # The CMake build compiles the out-of-process streamdock-host sidecar via
      # cargo (cmake/StreamdockSidecar.cmake). GitHub runners ship Rust, but pin
      # stable explicitly + cache the cargo store so the mirajazz git dependency
      # is fetched/compiled once per Cargo.lock instead of every run.
      - name: Set up Rust (stable)
        run: rustup toolchain install stable --profile minimal --no-self-update && rustup default stable
      - name: Cache cargo registry + git
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('streamdock-host/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # ---- Configure, build, test -----------------------------------------
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

      # Phase 04 (Plan 04-06): explicit Win32 hot-plug smoke-ran gate.
      # The canonical `ctest --preset windows-release` above picks up the new
      # `test_hotplug_win32_smoke.cpp` automatically. This second invocation
      # adds a loud failure mode if the suite is somehow skipped (compile-
      # defined-out, name regex mismatch, test-list filter drift) — fails CI
      # if zero hot-plug tests run on the Windows runner. Mitigates the
      # Cross-Cutting pitfall (Linux-CI-blind Windows breakage) for HOTPLUG-06.
      # Regex matches the actual test names: test_hotplug_harness.cpp uses
      # "hot-plug" with hyphen and the HOTPLUG-* tag; test_hotplug_win32_smoke.cpp
      # uses "Win32 device-path ..." and "Win32 injectEvent ..." patterns. The
      # previous regex `hotplug` (no hyphen) plus the flag typo `--test-regex`
      # (correct: --tests-regex / -R) both contributed to the v1.1 audit's
      # "Windows CI green build PENDING" — the typo was a hard error, and the
      # regex would have matched zero tests on Windows even after the typo fix.
      - name: Verify Windows hot-plug smoke ran
        if: runner.os == 'Windows'
        run: ctest --preset ${{ matrix.preset }} --tests-regex "hot-plug|HOTPLUG|injectEvent|device-path" --output-on-failure

      # ---- Python tests ---------------------------------------------------
      - name: Run Python tests
        run: pytest python/ -q

  # ---------------------------------------------------------------------------
  # Coverage — Linux debug + gcov/lcov.
  # ---------------------------------------------------------------------------
  coverage:
    name: Code coverage
    runs-on: ubuntu-24.04
    needs: build
    if: github.event_name == 'push'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          # Build-path parity with the build matrix (webui/bundle blocks are
          # exercised, not silently skipped). See the build job note.
          submodules: recursive
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build lcov libudev-dev \
              libusb-1.0-0-dev libhidapi-dev python3-dev \
              libgl1-mesa-dev libxkbcommon-dev \
              libwayland-dev wayland-protocols libx11-dev

      - uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730  # v4.3.1
        with:
          version: 6.8.3
          cache: true
          # qtwayland ships in the BASE desktop install since the 2026-06 Qt
          # repo restructure (see the build job note) — do not list it here.
          # qtwebengine et al.: packaging parity, see the build job note.
          modules: qtwebsockets qtwebengine qtwebchannel qtpositioning

      # Same rationale as the `build` job: the C++ test_manifest_signer.cpp
      # cases exec `python3 sign-plugin-manifest.py` which imports
      # `cryptography`, so dev deps must be in scope before ctest.
      - name: Install Python package
        run: pip install -e .[dev]

      - name: Configure
        # AJAZZ_ENABLE_WERROR=OFF for the coverage build only because
        # `--coverage -O0 -g` (see cmake/Sanitizers.cmake) makes GCC emit
        # benign -Wmaybe-uninitialized warnings against gcov instrumentation
        # output. Promoting those to errors blocks the lcov report without
        # adding any code-quality signal — every other CI build still runs
        # with -Werror via the default preset.
        run: |
          cmake -S . -B build-cov -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DAJAZZ_ENABLE_COVERAGE=ON \
            -DAJAZZ_ENABLE_WERROR=OFF

      - name: Build & test
        # -LE qml: the QML smoke tests instantiate a real QQmlEngine, which
        # SIGSEGVs under gcov coverage instrumentation (gcov x Qt-QML) while
        # passing in every normal build. They contribute no logic coverage,
        # so exclude them here; the release build matrix still runs them.
        run: |
          cmake --build build-cov
          ctest --test-dir build-cov --output-on-failure --label-exclude qml

      - name: Generate report
        run: |
          lcov --capture --directory build-cov --output-file coverage.info \
            --ignore-errors mismatch,negative,source,unused
          lcov --remove coverage.info '/usr/*' '*/_deps/*' '*/tests/*' \
            --output-file coverage.info \
            --ignore-errors unused
          lcov --list coverage.info
          # Print the aggregate rate prominently so the line/function totals
          # are visible in the job log every run (trend tracking without an
          # external service).
          lcov --summary coverage.info

      - name: Enforce coverage floor
        run: |
          # Health-report finding #7: the coverage report was upload-only,
          # with no gate. Parse the aggregate line rate and fail if it drops
          # below a floor. NOTE: this is a CATASTROPHIC-REGRESSION guard, not
          # a target — it is deliberately conservative because this is a
          # Linux-only coverage build of a cross-platform codebase (the
          # win32/macOS plugin-host + sandbox paths are #ifdef'd out and
          # cannot be covered here, depressing the aggregate). Ratchet the
          # floor up toward the observed baseline once a CI run establishes it.
          FLOOR=40
          RATE=$(lcov --summary coverage.info 2>&1 \
            | sed -n 's/.*lines\.*:\s*\([0-9.]*\)%.*/\1/p' | head -1)
          if [ -z "$RATE" ]; then
            echo "::error::Could not parse line coverage rate from lcov --summary"
            exit 1
          fi
          echo "Line coverage: ${RATE}% (floor ${FLOOR}%)"
          # Integer compare (truncate the fractional part) to avoid bc/awk float deps.
          if [ "${RATE%.*}" -lt "$FLOOR" ]; then
            echo "::error::Line coverage ${RATE}% is below the ${FLOOR}% floor"
            exit 1
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: coverage
          path: coverage.info

  # ---------------------------------------------------------------------------
  # Sanitizer matrix — Linux only (closes #41).
  # ASan + UBSan run together (cheap, catches the most defects). TSan runs in
  # its own job because the instrumentation is incompatible with ASan and the
  # GIL of the embedded Python interpreter currently prevents running TSan with
  # the full app, so we restrict the suite to the C++ unit and integration
  # tests where we exercise the EventBus concurrency invariants.
  # ---------------------------------------------------------------------------
  sanitizers:
    name: Sanitizers · ${{ matrix.flavour }}
    runs-on: ubuntu-24.04
    needs: build
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavour: ASan+UBSan
            cmake_flags: -DAJAZZ_ENABLE_SANITIZERS=ON
            asan_options: detect_leaks=1:strict_string_checks=1:check_initialization_order=1
            ubsan_options: print_stacktrace=1:halt_on_error=1
            # LSan suppression list for known-narrow Qt6 + fontconfig
            # init leaks (QGuiApplication's static-destructor fiasco
            # path; see tests/sanitizers/lsan_suppressions.txt for the
            # rationale + complete entry list). Suppressing only
            # specific symbols keeps real leak detection in
            # non-Qt code intact.
            #
            # The path is interpolated as $GITHUB_WORKSPACE-rooted in the
            # `Run unit + integration tests` step below: ctest sets the
            # test-binary CWD to the per-target build dir (e.g.
            # build-san/tests/unit/), so a relative path here resolves
            # to the wrong file and ASan exits non-zero with "failed to
            # read suppressions file". The absolute substitution keeps
            # the file readable regardless of which sub-binary ctest is
            # currently driving.
            lsan_options_relative: "tests/sanitizers/lsan_suppressions.txt"
            tsan_options: ""
          - flavour: TSan
            cmake_flags: -DAJAZZ_ENABLE_TSAN=ON
            asan_options: ""
            ubsan_options: ""
            lsan_options_relative: ""
            tsan_options: halt_on_error=1:second_deadlock_stack=1
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          # Build-path parity with the build matrix (webui/bundle blocks are
          # exercised, not silently skipped). See the build job note.
          submodules: recursive
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
              build-essential cmake ninja-build pkg-config \
              libudev-dev libusb-1.0-0-dev libhidapi-dev \
              libgl1-mesa-dev libxkbcommon-dev libxcb1-dev \
              libxcb-cursor-dev libxkbcommon-x11-dev \
              libwayland-dev wayland-protocols libx11-dev \
              python3-dev python3-pip
      - uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730  # v4.3.1
        with:
          version: 6.8.3
          cache: true
          # qtwayland (Qt6::WaylandClient + qtwaylandscanner, Phase 34 APROF-01
          # watcher) is NO LONGER a separate module: the 2026-06 restructure of
          # the Qt online repo folded the qtwayland archive into the BASE
          # desktop install (only qtwaylandcompositor remains an addon), and
          # requesting the old module name now hard-fails aqtinstall on every
          # platform ("packages ['qtwayland'] were not found").
          modules: qtshadertools qtwebsockets qtwebengine qtwebchannel qtpositioning

      # Same rationale as the `build` job: ctest runs the manifest verifier
      # tests which exec `python3 sign-plugin-manifest.py`, importing
      # `cryptography` — install dev deps before the test step.
      - name: Install Python package
        run: pip install -e .[dev]

      - name: Configure (Debug + sanitizer)
        run: |
          cmake -S . -B build-san -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DAJAZZ_ENABLE_WERROR=OFF \
            -DAJAZZ_BUILD_APP=OFF \
            -DAJAZZ_BUILD_PYTHON_HOST=OFF \
            ${{ matrix.cmake_flags }}

      - name: Build
        run: cmake --build build-san --target ajazz_unit_tests ajazz_integration_tests

      - name: Run unit + integration tests
        env:
          ASAN_OPTIONS: ${{ matrix.asan_options }}
          UBSAN_OPTIONS: ${{ matrix.ubsan_options }}
          # Absolute path to the suppressions file so it resolves regardless
          # of which sub-binary ctest is currently driving. Empty when the
          # matrix entry didn't request suppressions (TSan flavour).
          LSAN_OPTIONS: ${{ matrix.lsan_options_relative && format('suppressions={0}/{1}:print_suppressions=0', github.workspace, matrix.lsan_options_relative) || '' }}
          TSAN_OPTIONS: ${{ matrix.tsan_options }}
        run: ctest --test-dir build-san --output-on-failure
