name: Lint

# Runs every pre-commit hook on push + PR. If any hook auto-fixed
# something, the fixes are pushed back as a follow-up commit so reviewers
# get a clean tree without the contributor having to re-run anything
# locally. This applies BOTH to:
#   * PRs from within the same repo (not forks) -> pushed to the PR head
#     branch (the feature branch). This is the primary GitFlow path:
#     feature -> develop, develop -> main.
#   * direct pushes to main / develop -> pushed back to that branch. With
#     "require a pull request before merging" branch protection enabled,
#     this only succeeds if github-actions[bot] is on the bypass list;
#     otherwise the PR path above has already produced a clean tree and
#     this is a harmless no-op (nothing to fix on the merge commit).
# The step re-runs after pushing; because the hooks are idempotent the
# second run finds nothing to fix and goes green, so there is no loop.

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================================================
  # Fast unified lint — runs every pre-commit hook in the same environment
  # that contributors use locally. If anything needs fixing, the job fails
  # and, when possible, a follow-up "auto-fix" commit is pushed to the PR.
  # ==========================================================================
  pre-commit:
    name: pre-commit (all hooks)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write      # needed to push auto-fix commits
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          # Full history so pre-commit can diff accurately.
          fetch-depth: 0
          # For PRs from the same repo, check out the head branch so we
          # can push auto-fixes back.
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          # Prefer a PAT so the auto-fix commit RE-TRIGGERS the check suite:
          # commits pushed with the default GITHUB_TOKEN do NOT start new
          # workflow runs (GitHub's recursion guard), so with required status
          # checks the PR head ends up with no checks reported and the PR
          # gets stuck "waiting for status". Add a repo secret
          # LINT_AUTOFIX_PAT (a PAT or fine-grained token with `contents:write`
          # + `workflows`/`actions`) to enable re-checks; falls back to
          # GITHUB_TOKEN (auto-fix still pushes, but you must re-push or
          # close/reopen the PR to get checks to run on the fix commit).
          token: ${{ secrets.LINT_AUTOFIX_PAT || secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system linters
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            clang-format-18 clang-tidy-18 \
            shellcheck
          sudo update-alternatives --install /usr/bin/clang-format clang-format \
              /usr/bin/clang-format-18 100
          sudo update-alternatives --install /usr/bin/clang-tidy clang-tidy \
              /usr/bin/clang-tidy-18 100

      - name: Cache pre-commit
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: pre-commit-${{ runner.os }}-

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Run all hooks
        id: run
        continue-on-error: true
        run: |
          pre-commit run --all-files --show-diff-on-failure --color always

      - name: Commit auto-fixes (PR head branch or direct push to main/develop)
        # continue-on-error so a push REJECTED by "require a pull request
        # before merging" branch protection (when github-actions[bot] is not
        # on the bypass list) does not turn the whole job red. On a PR the
        # head branch is unprotected so the push succeeds; on a protected
        # main/develop the PR that produced the merge has already applied the
        # same fixes, so a rejected push here is benign.
        continue-on-error: true
        if: |
          steps.run.outcome == 'failure' &&
          (
            (github.event_name == 'pull_request' &&
             github.event.pull_request.head.repo.full_name == github.repository)
            || github.event_name == 'push'
          )
        uses: stefanzweifel/git-auto-commit-action@04702edda442b2e678b25b537cec683a1493fcb9  # v7.1.0
        with:
          commit_message: "style: apply pre-commit auto-fixes"
          commit_user_name: ajazz-bot
          commit_user_email: ajazz-bot@users.noreply.github.com

      - name: Re-run hooks after auto-fix
        if: steps.run.outcome == 'failure'
        run: pre-commit run --all-files

  # ==========================================================================
  # Clang-tidy with compile_commands.json — real static analysis requiring
  # a CMake configure + build cache. Separate job so it can run in parallel.
  # ==========================================================================
  clang-tidy:
    name: clang-tidy (static analysis)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          # The webui CMake block (AJAZZ_BUILD_WEBUI, default ON) runs `npm ci`
          # in the opendeck submodule at CONFIGURE time now that this runner's
          # Qt includes qtwebengine — without the submodule the configure (and
          # thus the compdb clang-tidy needs) hard-fails on a missing
          # package.json.
          submodules: recursive
      - name: Install toolchain
        # Qt is installed via install-qt-action below; here we only install
        # the system bits CMake / clang-tidy need to be able to configure
        # the project (X11 dev headers Qt links against, libudev, python).
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ pkg-config \
            python3-dev python3-pip \
            libudev-dev libsystemd-dev \
            libusb-1.0-0-dev libhidapi-dev \
            libgl1-mesa-dev libxkbcommon-dev libxcb1-dev \
            libxcb-cursor-dev libxkbcommon-x11-dev \
            libwayland-dev wayland-protocols \
            clang-tidy-18
          sudo update-alternatives --install /usr/bin/clang-tidy clang-tidy \
              /usr/bin/clang-tidy-18 100

      - name: Install Qt 6.7
        # Project requires Qt >= 6.7 (see top-level CMakeLists.txt); the
        # qt6-* apt packages on ubuntu-24.04 only provide Qt 6.4.
        # `qtwebsockets` is required by src/app/src/sd_plugin_server.cpp
        # (Stream Deck Elgato v6 plugin server, P3.16); without it
        # clang-tidy errors out with "'QWebSocket' file not found".
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730  # v4.3.1
        with:
          version: 6.8.3
          # qtwebengine (+deps qtwebchannel qtpositioning) entered with the
          # embedded OpenDeck SPA (opendeck_scheme_handler.hpp includes
          # QWebEngineUrlSchemeHandler); without it clang-tidy hard-errors on
          # every WebEngine TU (develop Lint failure 2026-07-02).
          modules: qtwebsockets qtwebengine qtwebchannel qtpositioning
          cache: true

      - name: Configure
        # AJAZZ_BUILD_SIDECAR=OFF: clang-tidy analyses C++ only and never builds,
        # so skip wiring the Rust sidecar (no cargo on this lint runner).
        run: cmake --preset dev -DAJAZZ_ENABLE_WERROR=OFF -DAJAZZ_BUILD_SIDECAR=OFF

      - name: Generate build-time headers needed for analysis
        # qtwaylandscanner outputs (qwayland-*.h + *-client-protocol.h, the
        # includes of active_window_watcher_wayland.cpp) are produced at
        # BUILD time, but this job only configures — clang-tidy hard-errors
        # with "file not found" on them. Exposed when the wayland system
        # deps were added to this job: the TU only enters
        # compile_commands.json once Qt6::WaylandClient is found. Build just
        # the scanner outputs (seconds, not a full compile). xargs -r keeps
        # this a no-op if a future configure drops the wayland backend.
        run: |
          ninja -C build/dev -t targets all \
            | awk -F': ' '/(qwayland-[^:]*\.h|client-protocol\.h):/ {print $1}' \
            | xargs -r ninja -C build/dev

      - name: Run clang-tidy on every translation unit
        run: |
          if [ ! -f build/dev/compile_commands.json ]; then
            echo "::error::compile_commands.json missing — cmake configure failed"
            exit 1
          fi
          # Parallelise across cores; tidy returns non-zero on its first error.
          # Use a shared exit-status file so a failure in any TU fails the job.
          status_file=$(mktemp)
          echo 0 > "$status_file"
          # shellcheck disable=SC2016  # $1/$2 are sh -c positional args, must stay literal
          find src -name '*.cpp' -print0 | \
            xargs -0 -P"$(nproc)" -I{} sh -c \
              'clang-tidy -p build/dev --quiet "$1" || echo $? > "$2"' \
              _ {} "$status_file"
          rc=$(cat "$status_file")
          rm -f "$status_file"
          [ "$rc" = 0 ]

  # ==========================================================================
  # Documentation linting — no C++ / Qt required, very fast.
  # ==========================================================================
  docs:
    name: docs (markdown + links)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.12"

      - name: Install mdformat + linkcheck
        run: pip install mdformat mdformat-gfm mdformat-tables mdformat-frontmatter pyyaml

      - name: README + wiki AUTOGEN blocks are in sync
        run: python3 scripts/generate-docs.py --check

      - name: Install Python dev tooling
        run: pip install -e .[dev]

      - name: mypy (strict, --config-file pyproject.toml)
        # pyproject.toml declares [tool.mypy] strict = true. This step
        # surfaces Python type errors before they ship; the C++ Lint job
        # ran for months without this gate, so plenty of plugin / signer
        # code was landing untyped.
        run: mypy python/ajazz_plugins scripts/sign-plugin-manifest.py

      - name: pytest (Python plugin + signer unit tests)
        # python/ajazz_plugins/tests covers the plugin SDK surface;
        # scripts/sign-plugin-manifest.py has its own coverage in
        # tests/. Same as `pyproject.toml [tool.pytest.ini_options]`.
        run: pytest -ra --strict-markers

      - name: Check Markdown formatting (via pre-commit, single source of truth)
        # Delegate to the pre-commit mdformat hook so the exclude list
        # stays in lockstep with .pre-commit-config.yaml and contributors
        # never see CI-only formatting failures.
        run: |
          pip install pre-commit
          pre-commit run mdformat --all-files --color always

      - name: Lychee (link checker)
        uses: lycheeverse/lychee-action@8646ba30535128ac92d33dfc9133794bfdd9b411  # v2.8.0
        with:
          # Config picks up retry/timeout/skip rules from lychee.toml so
          # the report stays focused on real breakage instead of
          # transient 5xx noise (docs.qt.io reshuffles its CDN every
          # few hours; vendor-RE doc URLs intentionally point at
          # non-reachable services).
          args: --verbose --no-progress --exclude-mail --config lychee.toml .
          fail: false   # Reports broken links as a warning, does not fail CI
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
