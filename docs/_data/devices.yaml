    notes: "8KHz-polling wireless mouse on SONiX VID prefix. Has an OLED basetta showing clock + DPI. The clock is a firmware RTC (HARDWARE-CONFIRMED 2026-05-21, commit 0a1952e): opcode 0x28 SET_OLEDCLOCK feature report with a required 0xD7 marker at byte 8, big-endian year, no checksum, sent via HidD_SetFeature; wired to IClockCapable so TimeSyncService drives it. (Supersedes the earlier opcode-0x25 SETTFTLCDDATA host-rendered RGB565 face, which never actually set the clock — the 0x25 render pipeline is kept only for a future custom-image feature.) Battery now reads on hardware via vendor status report 0x05 byte 3 (0..100, 0x64=100%) over GET_FEATURE on the 0xFFFF (usage 0x02) control collection, with reconnect frame-validation (a valid frame has bytes 1/2 zero; malformed transient frames after a replug are rejected so there is no spurious 1% flash — commit 1f2be0c). Wire-format rewrite landed in P3.12.1/.2 (656fb1c, 0e9bb04)."
    feature_summary:
      works:
        - "Descriptor + factory wired in register.cpp (3151:5007)"
        - "P0 safety guard: damaging commit() helper (opcode 0x50) removed; no longer corrupts button slot 0"
      partial: []
