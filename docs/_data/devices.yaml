    vid: "0x0c45"
    pid: "0x8009"
    maturity: functional
    capabilities: [rgb, macros, layers, clock, battery]
    protocol_doc: docs/protocols/keyboard/proprietary.md
    notes: "Microdia/Sonix SN32F299 wireless mech; routed through the proprietary backend. ARCH-05.1 (2026-05-17) located the firmware RTC wire format: 4-packet HID Feature Report envelope (START 0x18 + PREAMBLE 0x28 + DATA magic 0x5A + SAVE 0x02), sent via writeFeature() (NOT write()), corroborated by gohv/EPOMAKER-Ajazz-AK820-Pro + KyleBoyer/TFTTimeSync-node + Agent B vendor binary disassembly; the per-packet delay+readback handshake was the missing piece, pinned on live hardware 2026-05-21 (commit 807b250)."
    feature_summary:
      works:
        - "Descriptor + factory wired in register.cpp (0c45:8009)"
        - "Time-sync HARDWARE-CONFIRMED working (2026-05-21): IClockCapable::setTime emits the 4-packet 0x18/0x28/data/0x02 envelope on the 0xFF13 control collection — but the envelope ALONE is a silent no-op; the device needs a request/RESPONSE handshake, so setTime does per packet a ~30ms settle delay + a best-effort GET_REPORT readback (writeFeature then readFeature), with the year-2000 byte encoding + 100ms SAVE settle. The on-device TFT clock follows the injected time (round-trip witness OBTAINED)"
        - "Battery charge level reads on hardware (2026-05-21): query opcode 0x20 sub 0x01, report id 0x00, reply via GET_FEATURE into a 65-byte buffer (64-byte fails on Windows) — opcode echo at resp[1], charge percent at resp[4] (0xFF wired+full clamps to 100, 0 = no battery)"
        - "RGB static / effect / per-LED buffer / brightness builders inherited from proprietary backend (AK680/AK510 wire format)"
        - "Macro chunked upload + key remap + layer switch inherited from proprietary backend"
      partial:
        - "RGB / macros / layers compile against the AK680/AK510 wire format — same chipset family is assumed but not field-confirmed on AK980 PRO specifically"
      pending:
        - "Negative witness for setTime: year 2099 produces visible-but-wrong display, proving firmware parses the field"
        - "TFT 1.14\" image upload (cmd 0x72) — DISPLAY-05 deferred to v1.2.x"
        - "20-mode RGB enum expansion (TaxMachine corpus has 20; our RgbEffect enum has 6)"
        - "Sleep-timer wire format (cmd 0x17 4-state enum per gohv) — capture per-byte layout"

  # ----- Mice --------------------------------------------------------------
  # The AJ-series mouse SKUs (AJ139 / AJ159 / AJ179 plus their MC / Pro / V2
  # / Max variants — 8 in total per the vendor manifest) share USB
  # descriptors at the USB layer. They are distinguished at runtime by a
  # vendor-specific "dev_id" readback (M129 = AJ139 PRO, M620 = AJ159, M630
  # = AJ159 MC, M179 / M603 = AJ179, M139 = AJ139 V2 PRO, …) — the registry
  # therefore enumerates by (vid, pid) tuple, not by SKU. Sources, captured
  # 2026-04-29: docs/research/vendor-protocol-notes.md Finding 8 (AJ159
  # driver `app/config.xml`) and Finding 9 (AJ199 Max `Config.ini` base64-
  # encoded VID/PID strings).
  #
  # Pre-2026-04-29 the four entries below were enumerated under VID
  # `0x3554` with sequential PIDs `0xF51A-D` — those values were not present
  # in any vendor config and turned out to be fictional. Real-world impact:
  # AJAZZ AJ159 / AJ139 / AJ179 mice were silently invisible on every OS,
  # and on Linux the udev `idVendor=="3554"` rule did not grant `uaccess`
  # for them. Tracking entry: TODO.md → "AJ-series VID:PID enumeration drift".

  - codename: aj_series_wired_primary
    family: mouse
    name: "AJAZZ AJ-series wired (primary)"
    vid: "0x248A"
    pid: "0x5C2E"
    maturity: scaffolded
    capabilities: [rgb, dpi, firmware]
    protocol_doc: docs/protocols/mouse/aj_series.md
    dpi_stages: 6
    notes: "Covers AJ139 PRO / AJ159 / AJ159 MC / AJ159P MC / AJ179 / AJ139 V2 PRO / AJ179 V2 / AJ179 V2 MAX in their canonical USB-wired mode. PAW3395 / PAW3311 / PAW3370 / PAW3335 / PAW3950 sensor depending on SKU. HID configuration interface is `MI_02`. Wire-format reconciliation against the vendor driver still pending — see TODO `AJ-series wire format reconciliation` and `vendor-protocol-notes.md` Finding 11."

