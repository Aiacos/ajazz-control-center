# =============================================================================
# Single source of truth for device support data.
#
# Every table or list in README.md / docs/wiki/Supported-Devices.md that
# mentions device status, USB IDs, features, or capabilities is GENERATED
# from this file by `scripts/generate-docs.py`.
#
# To update the public-facing docs:
#   1. Edit this file (or just add a new entry at the bottom).
#   2. Run `make docs` (or let the pre-commit hook / CI do it for you).
#
# Never hand-edit the AUTOGEN blocks in README.md or the wiki — any manual
# change there will be overwritten at the next sync.
# =============================================================================

# maturity tiers — order controls table sort + legend order
maturity_tiers:
  scaffolded: { emoji: "🟡", label: "scaffolded", description: "descriptor + factory exist; backend compiles but does not exercise the device" }
  probed:     { emoji: "🔵", label: "probed",     description: "device enumerates and descriptor populated; no protocol writes confirmed" }
  partial:    { emoji: "🟠", label: "partial",    description: "some features work end-to-end; advertised capability set incomplete or untested" }
  functional: { emoji: "🟢", label: "functional", description: "all advertised capabilities work in practice; tested manually or in CI" }
  verified:   { emoji: "✅", label: "verified",   description: "functional + automated CI on real hardware OR sustained user-confirmed reliability" }

# capability keys → human label (used in feature matrix)
capabilities:
  display: "Per-key display"
  rgb: "RGB backlight"
  encoder: "Encoder / dial"
  touch: "Touch strip"
  macros: "Macros"
  dpi: "DPI stages"
  layers: "Layers"
  firmware: "Firmware version"
  clock: "Host-settable clock (scaffolded)"
  battery: "Battery charge level (wireless)"

